<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data - HealthMateAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <h1>👤 Input Data</h1>

        <p>Isi data dasar terlebih dahulu.</p>

        <input
            type="text"
            id="nama"
            placeholder="Nama / panggilan"
        >

        <input
            type="number"
            id="umur"
            placeholder="Umur"
            min="1"
            max="120"
        >

        <select id="jenisKelamin">
            <option value="">Pilih jenis kelamin</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select>

        <button type="button" id="btnLanjut">
            Lanjut
        </button>

    </div>


    <!-- Script utama -->
    <script src="script.js"></script>


    <!-- Fungsi khusus halaman data -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const tombol = document.getElementById("btnLanjut");

            tombol.addEventListener("click", function () {

                const nama = document
                    .getElementById("nama")
                    .value
                    .trim();

                const umur = document
                    .getElementById("umur")
                    .value
                    .trim();

                const jenisKelamin = document
                    .getElementById("jenisKelamin")
                    .value;


                // Validasi
                if (!nama || !umur || !jenisKelamin) {

                    alert(
                        "Silakan lengkapi semua data terlebih dahulu."
                    );

                    return;
                }


                // Simpan data
                localStorage.setItem(
                    "nama",
                    nama
                );

                localStorage.setItem(
                    "umur",
                    umur
                );

                localStorage.setItem(
                    "jenisKelamin",
                    jenisKelamin
                );


                // Pindah ke halaman gejala
                window.location.href = "gejala.html";

            });

        });
    </script>

</body>
</html>

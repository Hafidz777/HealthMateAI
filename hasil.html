<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hasil - HealthMateAI</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="form-container">

        <h1>📊 Hasil</h1>

        <p id="sapaan"></p>


        <!-- =========================
             RINGKASAN KELUHAN
        ========================== -->

        <div class="hasil-box">

            <h2>Ringkasan Keluhan</h2>

            <p id="hasilKeluhan"></p>

            <p id="hasilGejala"></p>

            <p id="hasilDurasi"></p>

            <p id="hasilTingkat"></p>

        </div>


        <!-- =========================
             HASIL ANALISIS DATABASE
        ========================== -->

        <div class="hasil-box">

            <h2>🔍 Kemungkinan Kondisi</h2>

            <div id="hasilPenyakit">

                <p>
                    🔄 Memuat hasil analisis...
                </p>

            </div>

        </div>


        <!-- =========================
             CATATAN
        ========================== -->

        <div class="hasil-box">

            <h2>⚠️ Catatan</h2>

            <p>
                Hasil ini bukan diagnosis medis.
                HealthMateAI hanya membantu memberikan
                informasi awal berdasarkan data yang dimasukkan.
            </p>

            <p>
                Jika keluhan berat, memburuk, atau muncul
                tanda bahaya, segera cari bantuan medis.
            </p>

        </div>


        <!-- =========================
             TOMBOL
        ========================== -->

        <button onclick="lanjutKeSaran()">
            💡 Lihat Saran
        </button>

        <button onclick="lanjutKeTandaBahaya()">
            🚨 Cek Tanda Bahaya
        </button>

        <button onclick="mulai()">
            🔄 Analisis Lagi
        </button>


    </div>


    <script src="script.js"></script>

</body>

</html>
